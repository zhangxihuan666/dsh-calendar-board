description:
  en: 'A project calendar on the DeepSeek Harness main column: month/week/day views grouped by project, only today gets a red dot while festivals and milestones use yellow and green, plus monthly outcomes, inline editing and one-click handoff of a task to a new chat with its date, project and note attached.'
  zh: '在 DeepSeek Harness 主栏放一张项目日历：月/周/日三视图按项目分组，只有今天一个红点，节日与节点分别用黄点绿点；带本月产出、直接在日期格里改事项，点任务可把日期、项目、备注一起带进新会话。'
